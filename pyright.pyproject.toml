[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
reportUnnecessaryTypeIgnoreComment = "error"
include = [
    "src/openklant/__init__.py",
    "src/openklant/accounts",
    "src/openklant/celery",
    "src/openklant/cloud_events",
    "src/openklant/conf",
    "src/openklant/urls.py",
    "src/openklant/utils",
    "src/openklant/wsgi.py",
    "src/openklant/setup.py",
    "src/openklant/components/token",
    "src/openklant/components/klantinteracties/admin",
    "src/openklant/components/views.py",
    "src/openklant/config",
    "src/openklant/setup_configuration",
    "src/openklant/migration"
]
exclude = [
    "src/openklant/conf/dev.py"
]
